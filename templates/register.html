{% extends "base.html" %}

{% block title %}Register - EduSphere{% endblock %}

{% block content %}
<div class="auth-container">
    <a href="{{ url_for('index') }}" class="auth-back-btn">
        <i class="fas fa-arrow-left"></i>Back to Home
    </a>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="card auth-card border-0">
                    <div class="card-body p-5">
                        <div class="auth-header">
                            <i class="fas fa-user-plus fa-4x mb-3"></i>
                            <h2 class="auth-title">Join EduSphere</h2>
                            <p class="auth-subtitle">Create your account and start your learning journey</p>
                        </div>
                        
                        <form method="POST" id="registerForm">
                            <!-- Role Selection -->
                            <div class="mb-4">
                                <label class="form-label fw-bold fs-5 text-center d-block mb-3">
                                    <i class="fas fa-users me-2"></i>Choose Your Role
                                </label>
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <div class="role-card" data-role="student">
                                            <input type="radio" name="role" value="student" id="student" required>
                                            <label for="student" class="role-label">
                                                <i class="fas fa-user-graduate fa-2x mb-2 text-primary"></i>
                                                <h6 class="fw-bold">Student</h6>
                                                <small>Learn and take tests</small>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="role-card" data-role="faculty">
                                            <input type="radio" name="role" value="faculty" id="faculty" required>
                                            <label for="faculty" class="role-label">
                                                <i class="fas fa-chalkboard-teacher fa-2x mb-2 text-success"></i>
                                                <h6 class="fw-bold">Faculty</h6>
                                                <small>Teach and create sessions</small>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="role-card" data-role="admin">
                                            <input type="radio" name="role" value="admin" id="admin" required>
                                            <label for="admin" class="role-label">
                                                <i class="fas fa-user-shield fa-2x mb-2 text-danger"></i>
                                                <h6 class="fw-bold">Admin</h6>
                                                <small>Manage platform</small>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="auth-input-group">
                                        <label for="full_name" class="form-label fw-semibold">Full Name</label>
                                        <div class="input-group">
                                            <span class="input-group-text auth-input-icon">
                                                <i class="fas fa-user"></i>
                                            </span>
                                            <input type="text" class="form-control auth-input" id="full_name" 
                                                   name="full_name" placeholder="Enter your full name" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="auth-input-group">
                                        <label for="username" class="form-label fw-semibold">Username</label>
                                        <div class="input-group">
                                            <span class="input-group-text auth-input-icon">
                                                <i class="fas fa-at"></i>
                                            </span>
                                            <input type="text" class="form-control auth-input" id="username" 
                                                   name="username" placeholder="Choose a username" required>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="auth-input-group">
                                        <label for="email" class="form-label fw-semibold">Email Address</label>
                                        <div class="input-group">
                                            <span class="input-group-text auth-input-icon">
                                                <i class="fas fa-envelope"></i>
                                            </span>
                                            <input type="email" class="form-control auth-input" id="email" 
                                                   name="email" placeholder="Enter your email" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="auth-input-group">
                                        <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                        <div class="input-group">
                                            <span class="input-group-text auth-input-icon">
                                                <i class="fas fa-phone"></i>
                                            </span>
                                            <input type="tel" class="form-control auth-input" id="phone" 
                                                   name="phone" placeholder="Enter phone number">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="auth-input-group">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text auth-input-icon">
                                        <i class="fas fa-lock"></i>
                                    </span>
                                    <input type="password" class="form-control auth-input" id="password" 
                                           name="password" placeholder="Create a strong password" required>
                                </div>
                                <div class="form-text">
                                    <i class="fas fa-info-circle me-1"></i>Password must be at least 6 characters long
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                                <label class="form-check-label" for="agreeTerms">
                                    I agree to the <a href="#" class="auth-link">Terms of Service</a> and 
                                    <a href="#" class="auth-link">Privacy Policy</a>
                                </label>
                            </div>

                            <button type="submit" class="btn auth-btn w-100 mb-3">
                                <i class="fas fa-rocket me-2"></i>Create My Account
                            </button>
                        </form>
                        
                        <div class="text-center">
                            <p class="mb-0">Already have an account? 
                                <a href="{{ url_for('login') }}" class="auth-link">Sign in here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Role selection functionality
    document.querySelectorAll('.role-card').forEach(card => {
        card.addEventListener('click', function() {
            const role = this.getAttribute('data-role');
            
            // Remove selected class from all cards
            document.querySelectorAll('.role-card').forEach(c => {
                c.classList.remove('selected');
            });
            
            // Add selected class to clicked card
            this.classList.add('selected');
            
            // Check the radio button
            document.getElementById(role).checked = true;
        });
    });

    // Form validation and submission
    const form = document.getElementById('registerForm');
    const submitBtn = form.querySelector('button[type="submit"]');
    
    form.addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        if (password.length < 6) {
            e.preventDefault();
            alert('Password must be at least 6 characters long');
            return false;
        }
        
        // Check if role is selected
        const roleSelected = document.querySelector('input[name="role"]:checked');
        if (!roleSelected) {
            e.preventDefault();
            alert('Please select a role');
            return false;
        }
        
        // Add loading animation
        submitBtn.classList.add('loading');
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Creating Account...';
    });
});
</script>
{% endblock %}
